<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKOS Launcher</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --n-0:  #0A0A23;
      --n-1:  #202040;
      --n-3:  #666C96;
      --n-4:  #DDE1F0;
      --n-5:  #F6F7FC;
      --n-w:  #FFFFFF;
      --ark-purple:       #6F4CFF;
      --ark-purple-mid:   #947EFF;
      --font-display: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-body:    "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-body);
      background: linear-gradient(160deg, var(--n-w) 0%, var(--n-5) 100%);
      color: var(--n-0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--ark-purple) 0%, var(--ark-purple-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      color: var(--n-w);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 2px;
      box-shadow: 0 8px 24px rgba(111, 76, 255, 0.20);
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--n-0);
    }

    p.subtitle {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 15px;
      line-height: 1.5;
      color: var(--n-1);
      margin: 0 0 32px;
      max-width: 440px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ark-purple);
      color: var(--n-w);
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(111, 76, 255, 0.25);
    }
    .btn:hover {
      background: var(--ark-purple-mid);
      box-shadow: 0 6px 16px rgba(111, 76, 255, 0.32);
    }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible {
      outline: 2px solid var(--ark-purple);
      outline-offset: 3px;
    }

    .arrow {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .status {
      font-family: var(--font-body);
      margin-top: 24px;
      font-size: 13px;
      color: var(--n-3);
      min-height: 18px;
    }

    .hint {
      font-family: var(--font-body);
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--n-4);
      font-size: 12px;
      color: var(--n-3);
      max-width: 380px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo" aria-hidden="true">ARK</div>

    <h1>Opening ARKOS</h1>
    <p class="subtitle">Redirecting you to ARKOS. If nothing happens within a few seconds, click the button below.</p>

    <!-- No target="_blank" — Teams sandbox blocks popups. We navigate the top frame instead. -->
    <button class="btn" id="launchBtn" type="button">
      Open ARKOS
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <p class="hint">Your Foundry session will sign you in automatically.</p>
  </div>

  <script>
    (function () {
      var ARKOS_URL = "https://arkos.arkinvest.palantirfoundry.com/";
      var statusEl = document.getElementById("status");
      var btn = document.getElementById("launchBtn");

      // Teams sandboxes static tab iframes without 'allow-popups', so window.open() is blocked.
      // Instead, navigate the top-level frame. Because the target domain is not in Teams'
      // validDomains, Teams escalates the navigation to the user's default browser.
      function goToArkos() {
        statusEl.textContent = "Opening ARKOS in your browser…";
        try {
          // Preferred: navigate the topmost frame (escapes the Teams sandbox).
          window.top.location.href = ARKOS_URL;
        } catch (e) {
          // If cross-origin access to window.top is denied, navigate self.
          window.location.href = ARKOS_URL;
        }
      }

      // Auto-launch on page load.
      window.addEventListener("load", function () {
        // Small delay so the user sees the launcher page briefly and understands what's happening.
        setTimeout(goToArkos, 600);
      });

      // Manual fallback if the auto-launch is blocked.
      btn.addEventListener("click", goToArkos);
    })();
  </script>
</body>
</html>

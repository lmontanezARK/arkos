<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKOS Launcher</title>

  <!-- Brand typefaces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Microsoft Teams JavaScript SDK (loaded from Microsoft's CDN, no install required) -->
  <script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"
          integrity="sha384-IRTYwedNwzGZSCgEDcMnXNm0wzkBYW6Vk1Q4iL9w7TtKvJ5JOmnpwlpHvNVqGhVe"
          crossorigin="anonymous"></script>

  <style>
    :root {
      --n-0:  #0A0A23;
      --n-1:  #202040;
      --n-3:  #666C96;
      --n-4:  #DDE1F0;
      --n-5:  #F6F7FC;
      --n-w:  #FFFFFF;
      --ark-purple:       #6F4CFF;
      --ark-purple-mid:   #947EFF;
      --font-display: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-body:    "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-body);
      background: linear-gradient(160deg, var(--n-w) 0%, var(--n-5) 100%);
      color: var(--n-0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--ark-purple) 0%, var(--ark-purple-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      color: var(--n-w);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 2px;
      box-shadow: 0 8px 24px rgba(111, 76, 255, 0.20);
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--n-0);
    }

    p.subtitle {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 15px;
      line-height: 1.5;
      color: var(--n-1);
      margin: 0 0 32px;
      max-width: 440px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ark-purple);
      color: var(--n-w);
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(111, 76, 255, 0.25);
    }
    .btn:hover {
      background: var(--ark-purple-mid);
      box-shadow: 0 6px 16px rgba(111, 76, 255, 0.32);
    }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible {
      outline: 2px solid var(--ark-purple);
      outline-offset: 3px;
    }

    .arrow {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .status {
      font-family: var(--font-body);
      margin-top: 24px;
      font-size: 13px;
      color: var(--n-3);
      min-height: 18px;
    }

    .hint {
      font-family: var(--font-body);
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--n-4);
      font-size: 12px;
      color: var(--n-3);
      max-width: 380px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo" aria-hidden="true">ARK</div>

    <h1>Opening ARKOS</h1>
    <p class="subtitle">ARKOS will open in your default browser. If nothing happens within a few seconds, click the button below.</p>

    <button class="btn" id="launchBtn" type="button">
      Open ARKOS
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <p class="hint">Your Foundry session will sign you in automatically.</p>
  </div>

  <script>
    (function () {
      var ARKOS_URL = "https://arkos.arkinvest.palantirfoundry.com/";
      var statusEl = document.getElementById("status");
      var btn = document.getElementById("launchBtn");
      var insideTeams = false;

      // Step 1: Initialize the Teams SDK. This call resolves successfully only when
      // the page is actually running inside the Teams client. If we're in a normal
      // browser (e.g., user testing the GitHub Pages URL directly), it rejects and
      // we fall back to standard browser behavior.
      function initializeTeams() {
        if (typeof microsoftTeams === "undefined") {
          // SDK didn't load (network blocked, CDN down). Fall back gracefully.
          return Promise.reject(new Error("Teams SDK not loaded"));
        }
        return microsoftTeams.app.initialize().then(function () {
          insideTeams = true;
        });
      }

      // Step 2: Open ARKOS using the right mechanism for the environment.
      //   - Inside Teams: use microsoftTeams.app.openLink(), which asks Teams to
      //     handle the URL externally (opens in user's default browser, Teams stays put).
      //   - Outside Teams: use window.open() with a target so it opens in a new tab.
      function openArkos() {
        statusEl.textContent = "Opening ARKOS…";
        if (insideTeams) {
          microsoftTeams.app.openLink(ARKOS_URL).then(function () {
            statusEl.textContent = "ARKOS opened in your browser.";
          }).catch(function (err) {
            statusEl.textContent = "Couldn't open ARKOS automatically. Click the button above.";
            console.error("Teams openLink failed:", err);
          });
        } else {
          // Standard browser path — works when testing the page outside Teams.
          window.open(ARKOS_URL, "_blank", "noopener,noreferrer");
        }
      }

      // Wire up the button so a user click always works as a fallback.
      btn.addEventListener("click", openArkos);

      // On page load: initialize Teams (if applicable), then auto-launch ARKOS
      // after a short delay so the user briefly sees the launcher render.
      window.addEventListener("load", function () {
        initializeTeams()
          .catch(function () { /* not in Teams — that's fine */ })
          .then(function () {
            setTimeout(openArkos, 600);
          });
      });
    })();
  </script>
</body>
</html>
